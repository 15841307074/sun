    - /admin-api/system/user/profile/update-password
    - /admin-api/system/user/profile/update
    - /admin-api/system/user/profile/update-avatar
    - /admin-api/system/captcha/get
    - /admin-api/system/captcha/check
    - /app-api/system/auth/get-permission-info
    - /admin-api/system/auth/get-permission-info
    - /app-api/system/auth/login
    - /app-api/system/auth/saveOrUpdateEquipment
    - /app-api/promotion/redPacket/notify
    - /app-api/errand/runner/withdraw/notify
    - /app-api/infra/file/download
    - /app-api/system/business/dc/getBusinessListByUser
    - /app-api/system/user/boss/getUserPermissions
    - /app-api/system/user/boss/getNavigationByRole
    - /admin-api/member/wecom/callback
    - /app-api/order/sq/process
    - /app-api/order/sq/process-appid-config
    - /app-api/order/dy/webhook
