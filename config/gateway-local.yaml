      x-forwarded:
        prefix-enabled: false # 避免 Swagger 重复带上额外的 /admin-api/system 前缀

logging:
  level:
    io.netty.util.ResourceLeakDetector: DEBUG
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径

knife4j:
  # 聚合 Swagger 文档，参考 https://doc.xiaominfo.com/docs/action/springcloud-gateway 文档
  gateway:
    enabled: true
    routes:
      - name: im-server
        service-name: im-server
        url: /admin-api/im/v3/api-docs
      - name: bpm-server
        service-name: bpm-server
        url: /admin-api/bpm/v3/api-docs
      - name: system-server
        service-name: system-server
        url: /admin-api/system/v3/api-docs
      - name: infra-server
        service-name: infra-server
        url: /admin-api/infra/v3/api-docs
      - name: commodity-server
        service-name: commodity-server
        url: /admin-api/commodity/v3/api-docs
      - name: member-server
        service-name: member-server
        url: /admin-api/member/v3/api-docs
      - name: order-server
        service-name: order-server
        url: /admin-api/order/v3/api-docs
      - name: promotion-server
        service-name: promotion-server
        url: /admin-api/promotion/v3/api-docs
      - name: pay-server
        service-name: pay-server
        url: /admin-api/pay/v3/api-docs
      - name: analysis-server
        service-name: analysis-server
        url: /admin-api/analysis/v3/api-docs
      - name: errand-server
        service-name: errand-server
        url: /admin-api/errand/v3/api-docs
    basic:
      enable: true
      username: admin # Basic 认证用户名
      password: ${CLOUD_GATEWAY_LOCAL_PASSWORD_L243:}
--- #################### lb相关配置 ####################
spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 10s

--- #################### Sentinel相关配置 ####################
spring:
  cloud:
    sentinel:
      transport:
        dashboard: testing-youdao-sentinel-dashboard-service
      enabled: true # 是否开启。默认为 true 开启
      eager: true # 是否饥饿加载。默认为 false 关闭
      filter:
        url-patterns: /** # 拦截请求的地址。默认为 /*
      #自定义流控降级异常信息
      #scg:
      #  fallback:
      #    mode: response
      #    response-body: '{"code": 429, "msg":"服务压力过大，请稍后重试!"}'
      # sentinel用nacos作为数据源的配置
      datasource:
        # 流控规则
        gw-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
            namespace: ${spring.cloud.nacos.config.namespace}
            username: ${spring.cloud.nacos.config.username}
            password: ${CLOUD_GATEWAY_LOCAL_PASSWORD_L274:}
            data-id:  ${spring.application.name}-flow-rules # 在修改的sentinel 源码中定义的规则名
            groupId: SENTINEL_GROUP
            rule-type: gw-flow
        # api分组规则
        gw-api-group:
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
            namespace: ${spring.cloud.nacos.config.namespace}
            username: ${spring.cloud.nacos.config.username}
            password: ${CLOUD_GATEWAY_LOCAL_PASSWORD_L284:}
            data-id:  ${spring.application.name}-api-rules # 在修改的sentinel 源码中定义的规则名
            groupId: SENTINEL_GROUP
            rule-type: gw-api-group
        # 降级规则
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
            namespace: ${spring.cloud.nacos.config.namespace}
            username: ${spring.cloud.nacos.config.username}
            password: ${CLOUD_GATEWAY_LOCAL_PASSWORD_L294:}
            dataId: ${spring.application.name}-degrade-rules
            groupId: SENTINEL_GROUP
            rule-type: degrade
        # 系统规则
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
            namespace: ${spring.cloud.nacos.config.namespace}
            username: ${spring.cloud.nacos.config.username}
            password: ${CLOUD_GATEWAY_LOCAL_PASSWORD_L304:}
            dataId: ${spring.application.name}-system-rules
            groupId: SENTINEL_GROUP
            rule-type: system
  data:
    redis:
      host: 192.168.31.141 # 地址
      port: 26379 # 端口
      database: 0 # 数据库索引
      password: ${CLOUD_GATEWAY_LOCAL_PASSWORD_L313:}
# redisson 配置
redisson:
  # redis key前缀
  keyPrefix: t
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: ${spring.application.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  server:
    port: 8081
  metrics:
    enable:
      all: false
      jvm: true
      application: true
      process: true
      system: true
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      base-path: /actuator # Actuator 提供的 API 接口的根目录。默认为 /actuator
      exposure:
        include: health,prometheus # 需要开放的端点。默认值只打开 health 和 info 两个端点。通过设置 * ，可以开放所有端点。
  endpoint:
    health:
      group:
        readiness:
          include: readinessState
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true

# Spring Boot Admin 配置项
spring:
  autoconfigure:
    exclude:
      - de.codecentric.boot.admin.client.config.SpringBootAdminClientAutoConfiguration # 禁用 Spring Boot Admin 的 Client

--- #################### 接口安全相关配置 ####################
security:
  # 安全过滤器总开关，设置为 false 可完全禁用所有安全检查
  enabled: false
  check-business: true
  sign:
    # 签名验证开关
    enabled: true
    # 签名密钥，生产环境请修改
    secret: ${CLOUD_GATEWAY_LOCAL_SECRET_L388:}
    # 签名过期时间（秒）
    expire-seconds: 300
  replay:
    # 防重放攻击检查开关
    enabled: true
    # 防重放窗口时间（秒）
    window-seconds: 60
    # 不需要防重放检查的路径
