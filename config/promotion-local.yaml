--- #################### 数据库相关配置 ####################
spring:
  # 数据源配置项
  datasource:
    dynamic: # 多数据源配置
      datasource:
        sharding:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
          url: jdbc:shardingsphere:nacos:sharding.yaml?serverAddr=${spring.cloud.nacos.config.server-addr}&namespace=${spring.cloud.nacos.config.namespace}&username=${spring.cloud.nacos.config.username}&password=${CLOUD_PROMOTION_LOCAL_EMBEDDED_PASSWORD:}
        shadow_sharding:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
          url: jdbc:shardingsphere:nacos:shadow_sharding.yaml?serverAddr=${spring.cloud.nacos.config.server-addr}&namespace=${spring.cloud.nacos.config.namespace}&username=${spring.cloud.nacos.config.username}&password=${CLOUD_PROMOTION_LOCAL_EMBEDDED_PASSWORD:}
  elasticsearch:
    repositories:
      enabled: true
    uris: "http://192.168.31.141:9200"
    # uris: "https://es-cn-rno438wed0006j382.elasticsearch.aliyuncs.com:9200" 生产
    socket-timeout: "10s"
    username: "elastic"
    password: ${CLOUD_PROMOTION_LOCAL_PASSWORD_L22:}
