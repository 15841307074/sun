--- #################### MQ相关配置 ####################
spring:
  rabbitmq:
    # 集群节点地址列表（逗号分隔）
    addresses: 192.168.31.141:5672,192.168.31.142:5672,192.168.31.143:5672
    username: admin
    password: ${CLOUD_PROMOTION_LOCAL_PASSWORD_L169:}
    virtual-host: saas_prod_vhost
    # 连接池配置
    connection-timeout: 3000
    cache:
      channel:
        size: 50  # 通道缓存数量
      connection:
        mode: CONNECTION  # 连接缓存模式
    # 消息确认配置
    publisher-confirm-type: correlated  # 发布确认
    publisher-returns: true  # 返回模式
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual  # 手动ACK
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
#会员卡发放权益线程配置
promotion:
  member-card-benefit:
    write-thread-num: 10
    write-chunk-size: 500
  sign:
    test-date-enabled: true
  member-card-coupon-archive: #一级会员卡发放优惠券任务是否开启 5:30限制
    daily-stop-enabled: false

userCoupon:
  exportLimit: 300000
