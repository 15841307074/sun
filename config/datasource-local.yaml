--- #################### 数据库相关配置 ####################
spring:
  datasource:
    druid: # Druid 【监控】相关的全局配置
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow: # 设置白名单，不填则允许所有访问
        url-pattern: /druid/*
        login-username: # 控制台管理用户名和密码
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 20 # 初始连接数
        min-idle: 20 # 最小连接池数量
        max-active: 100 # 最大连接池数量
        max-wait: 5000 # 配置获取连接等待超时的时间，单位：毫秒
        time-between-eviction-runs-millis: 30000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间，单位：毫秒
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间，单位：毫秒
        validation-query: SELECT 1 # 配置检测连接是否有效
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      primary: master
      datasource:
        master:
          url: jdbc:mysql://192.168.31.141:3307/cloud_0090_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
          username: root
          password: ${CLOUD_DATASOURCE_LOCAL_PASSWORD_L40:}
        shadow_master:
          url: jdbc:mysql://192.168.31.141:3307/cloud_0090_test_shadow?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
          username: root
          password: ${CLOUD_DATASOURCE_LOCAL_PASSWORD_L44:}

  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
  data:
    redis:
      cluster:
        max-redirects: 3 # 获取失败时的最大重定向次数
        nodes:
          - 192.168.31.141:6379
          - 192.168.31.141:6380
          - 192.168.31.142:6379
          - 192.168.31.142:6380
          - 192.168.31.143:6379
          - 192.168.31.143:6380
      database: 0 # 数据库索引
      password: ${CLOUD_DATASOURCE_LOCAL_PASSWORD_L59:}
      timeout: 30s
      connect-timeout: 60s

redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 32
  # Netty线程池数量
  nettyThreads: 64
  # 单节点配置
  clusterServersConfig:
    # 客户端名称
    clientName: ${spring.application.name}
    # 最小空闲连接数
    masterConnectionMinimumIdleSize: 32
    # 连接池大小
    masterConnectionPoolSize: 64
    slaveConnectionMinimumIdleSize: 32
    slaveConnectionPoolSize: 64
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 5000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50
    readMode: "SLAVE"
    subscriptionMode: "MASTER"