--- #################### MQ相关配置 ####################
spring:
  rabbitmq:
    # 集群节点地址列表（逗号分隔）
    addresses: 192.168.31.141:5672,192.168.31.142:5672,192.168.31.143:5672
    username: admin
    password: ${CLOUD_ORDER_LOCAL_PASSWORD_L100:}
    virtual-host: saas_prod_vhost
    # 连接池配置
    connection-timeout: 3000
    cache:
      channel:
        size: 50  # 通道缓存数量
      connection:
        mode: CONNECTION  # 连接缓存模式
    # 消息确认配置
    publisher-confirm-type: correlated  # 发布确认
    publisher-returns: true  # 返回模式
    listener:
      simple:
        acknowledge-mode: manual  # 手动ACK
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

kafka:
  consumer:
    enable: true    # 是否开启
    groupId: saas_canal    # 消费者组
    bootstrapServers: node01-local.kafka.htyoudao.com:9092,node02-local.kafka.htyoudao.com:9092,node03-local.kafka.htyoudao.com:9092    # 外网kafka节点
    keyDeserializer: org.apache.kafka.common.serialization.StringDeserializer    # key反序列化器
    valueDeserializer: org.apache.kafka.common.serialization.StringDeserializer    # value反序列化器
    useSecurity: true    # 是否开启安全认证
    securityProtocol: SASL_PLAINTEXT    # 安全认证使用的协议
    saslJaasConfig: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${CLOUD_JAAS_PASSWORD:}";    # 安全认证所需信息
    saslMechanism: PLAIN    # 安全认证机制
    concurrency: 1
  topic:
    order-notify: order-notify
    order-refund: order-refund
  group:
    order-refund: 0
    order-notify: 0
  producer:
    enable: true    # 是否开启
    orderNotifyTopic: orderNotifyTopic    # 订阅主题
    orderNotifyGroupId: 1    # 订阅主题
    bootstrapServers: node01-local.kafka.htyoudao.com:9092,node02-local.kafka.htyoudao.com:9092,node03-local.kafka.htyoudao.com:9092    # kafka节点
    keySerializer: org.apache.kafka.common.serialization.StringSerializer    # key序列化器
    valueSerializer: org.apache.kafka.common.serialization.StringSerializer    # value序列化器
    useSecurity: true    # 是否开启安全认证
    securityProtocol: SASL_PLAINTEXT    # 安全认证使用的协议
    saslJaasConfig: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${CLOUD_JAAS_PASSWORD:}";    # 安全认证所需信息
    saslMechanism: PLAIN    # 安全认证机制

