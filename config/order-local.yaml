--- #################### 数据库相关配置 ####################
spring:
  elasticsearch:
    repositories:
      enabled: true
    uris: "http://192.168.31.141:9200"
    socket-timeout: "10s"
    username: "elastic"
    password: ${CLOUD_ORDER_LOCAL_PASSWORD_L9:}
  datasource:
    dynamic: # 多数据源配置
      datasource:
        sharding:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
          url: jdbc:shardingsphere:nacos:sharding.yaml?serverAddr=${spring.cloud.nacos.config.server-addr}&namespace=${spring.cloud.nacos.config.namespace}&username=${spring.cloud.nacos.config.username}&password=${CLOUD_ORDER_LOCAL_EMBEDDED_PASSWORD:}
