      #有奖问答 end
      #投票
      activity-vote-reward-log-inline:
        type: INLINE
        props:
          algorithm-expression: activity_vote_reward_log_${member_mobile % 10}
      activity-vote-log-inline:
        type: INLINE
        props:
          algorithm-expression: activity_vote_log_${member_mobile % 10}
      #投票 end
      smart-time-sharding:
        props:
          strategy: complex
          algorithmClassName: com.htyoudao.youdao.framework.sharding.core.alg.SmartTimeShardingAlgorithm
        type: CLASS_BASED
  - !SINGLE
    tables:
      - "*.*"