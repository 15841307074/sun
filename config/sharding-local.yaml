        tableStrategy:
          complex:
            shardingColumns: create_time,order_sn
            shardingAlgorithmName: smart-time-sharding
      bz_order_purchase:
        actualDataNodes: db_master.bz_order_purchase_${2024..2028}0${1..9},db_master.bz_order_purchase_${2024..2028}1${0..2}
        tableStrategy:
          complex:
            shardingColumns: create_time,order_sn
            shardingAlgorithmName: smart-time-sharding
      #抽签 str
      activity_cq_join:
        actualDataNodes: db_master.activity_cq_join_${0..9}
        tableStrategy:
          standard:
            shardingColumn: member_id
            shardingAlgorithmName: activity-cq-join-inline
