            shardingAlgorithmName: activity-vote-reward-log-inline
      activity_vote_log:
        actualDataNodes: db_master.activity_vote_log_${0..9}
        tableStrategy:
          standard:
            shardingColumn: member_mobile
            shardingAlgorithmName: activity-vote-log-inline

    shardingAlgorithms:
      member_inline:
        type: INLINE
        props:
          algorithm-expression: wx_member_${sharding_value}
      user-coupon-inline:
        type: INLINE
        props:
          algorithm-expression: user_coupon_${user_id % 10}
      user-coupon-package-inline:
        type: INLINE
        props:
          algorithm-expression: user_coupon_package_${user_id % 10}
      points_inline:
        type: INLINE
        props:
          algorithm-expression: points_log_${sharding_value}
      lottery-log-inline:
        type: INLINE
        props:
          algorithm-expression: lottery_log_${member_id % 10}
      activity-card-log-inline:
        type: INLINE
        props:
          algorithm-expression: activity_card_log_${member_id % 10}
      activity-jk-help-inline:
        type: INLINE
        props:
          algorithm-expression: activity_jk_help_${inviter_member_id % 10}
      activity-jk-task-inline:
        type: INLINE
        props:
          algorithm-expression: activity_jk_task_${member_id % 10}
      lottery-task-inline:
        type: INLINE
        props:
          algorithm-expression: lottery_task_${member_id % 10}
      lottery-help-inline:
        type: INLINE
        props:
          algorithm-expression: lottery_help_${inviter_member_id % 10}

      #抽签 str
      activity-help-inline:
        type: INLINE
        props:
          algorithm-expression: activity_help_${inviter_member_id % 10}
      activity-task-inline:
