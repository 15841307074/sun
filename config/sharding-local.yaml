        props:
          algorithm-expression: activity_task_${member_id % 10}
      activity-cq-join-inline:
        type: INLINE
        props:
          algorithm-expression: activity_cq_join_${member_id % 10}
      activity-cq-log-inline:
        type: INLINE
        props:
