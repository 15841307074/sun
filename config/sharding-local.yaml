            shardingAlgorithmName: smart-time-sharding
      bz_order_log:
        actualDataNodes: db_master.bz_order_log_${2024..2028}0${1..9},db_master.bz_order_log_${2024..2028}1${0..2}
        tableStrategy:
          complex:
            shardingColumns: create_time,order_sn
            shardingAlgorithmName: smart-time-sharding
      bz_order_pay:
