databaseName: sharding
dataSources:
  db_master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    jdbcUrl: jdbc:mysql://192.168.31.141:3307/cloud_0090_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
    username: root
    password: ${CLOUD_SHARDING_LOCAL_PASSWORD_L7:}
    keepaliveTime: 30000
    maximumPoolSize: 100
    minimumIdle: 20
    connectionTimeout: 5000
    idleTimeout: 300000
    maxLifetime: 600000

rules:
  - !SHARDING
    tables:
      wx_member:
        actualDataNodes: db_master.wx_member_${0..9}
        tableStrategy:
          standard:
            shardingColumn: sharding_value
            shardingAlgorithmName: member_inline
      sys_pay_record:
        actualDataNodes: db_master.sys_pay_record_${2024..2028}0${1..9},db_master.sys_pay_record_${2024..2028}1${0..2}
        tableStrategy:
          complex:
            shardingColumns: create_time,order_sn
            shardingAlgorithmName: smart-time-sharding
      user_coupon:
        actualDataNodes: db_master.user_coupon_${0..9}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user-coupon-inline
      user_coupon_package:
        actualDataNodes: db_master.user_coupon_package_${0..9}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user-coupon-package-inline
      points_log:
        actualDataNodes: db_master.points_log_${0..9}
        tableStrategy:
          standard:
            shardingColumn: sharding_value
            shardingAlgorithmName: points_inline
      lottery_log:
        actualDataNodes: db_master.lottery_log_${0..9}
        tableStrategy:
          standard:
            shardingColumn: member_id
            shardingAlgorithmName: lottery-log-inline
      activity_card_log:
        actualDataNodes: db_master.activity_card_log_${0..9}
        tableStrategy:
          standard:
            shardingColumn: member_id
            shardingAlgorithmName: activity-card-log-inline
      activity_jk_help:
        actualDataNodes: db_master.activity_jk_help_${0..9}
        tableStrategy:
          standard:
            shardingColumn: inviter_member_id
            shardingAlgorithmName: activity-jk-help-inline
      activity_jk_task:
        actualDataNodes: db_master.activity_jk_task_${0..9}
        tableStrategy:
          standard:
            shardingColumn: member_id
            shardingAlgorithmName: activity-jk-task-inline
      lottery_help:
        actualDataNodes: db_master.lottery_help_${0..9}
        tableStrategy:
          standard:
            shardingColumn: inviter_member_id
            shardingAlgorithmName: lottery-help-inline
      lottery_task:
        actualDataNodes: db_master.lottery_task_${0..9}
        tableStrategy:
          standard:
            shardingColumn: member_id
            shardingAlgorithmName: lottery-task-inline
      bz_order:
        actualDataNodes: db_master.bz_order_${2024..2028}0${1..9},db_master.bz_order_${2024..2028}1${0..2}
        tableStrategy:
          complex:
