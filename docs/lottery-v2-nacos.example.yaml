# Merge into promotion's existing Nacos YAML (do not replace unrelated configuration).
promotion:
  lottery:
    accepting: true
    # All new draws use V2; no activity allowlist. Reconcile history before resuming old activities.
    draw-rate: 100
    query-rate: 1000
    result-rate: 300
    task-rate: 200
    activity-draw-rate: 60
    member-draw-rate: 1
    draw-concurrency: 8
    grant-concurrency: 4
    connection-budget: 16
    config-ttl-seconds: 1800
    list-ttl-seconds: 30
    result-ttl-seconds: 86400
    refill-concurrency: 4

