# 合并到会员服务实际加载的 Nacos 配置，勿覆盖已有 member/points 节点。
# 与 promotion.member-card-benefit 独立，本任务不创建多线程写入池。
member:
  points:
    unfreeze:
      max-workers: 2               # 默认 2，参与处理的 Pod 数上限，范围 1～8，超出按 8 限制
      batch-size: 200              # 单次查询条数，上限 500
      max-duration-seconds: 300    # 单段时长，上限 900 秒，自动任务会继续下一段
      max-pages: 100               # 自动任务每段页数，人工接口整次页数，上限 100
      page-pause-millis: 50        # 每页事务结束后暂停，范围 0～1000 毫秒
      daily-stop-enabled: true    # 生产保留 true，false 取消自动任务的每日停止窗口
      end-hour: 6                  # 上海时区，默认到 06:00 停止启动新事务
